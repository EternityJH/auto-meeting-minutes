<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>授權麥克風權限 - Auto Meeting Minutes</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);
    }
    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .status {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }
    .status.success {
      color: var(--success);
    }
    .status.error {
      color: var(--error);
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: 6px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="var(--primary)">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
      </svg>
    </div>
    <h2>麥克風權限授權</h2>
    <p>為了能在會議錄製時混合您說話的聲音（將您的麥克風聲音與會議聲音混音），我們需要取得您的麥克風使用授權。</p>
    <button class="btn" id="btn-request">立即授權麥克風</button>
    <div class="status" id="status-msg"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
